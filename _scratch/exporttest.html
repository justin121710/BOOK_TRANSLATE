<!DOCTYPE html>
<meta charset="utf-8">
<title>PDF 匯出驗證</title>
<style>
  body { background:#fff; color:#111; font:13px/1.6 system-ui; margin:12px; }
  pre { background:#f5f5f5; padding:10px; white-space:pre-wrap; font-size:12px; }
  .pass { color:#0a0; } .fail { color:#c00; font-weight:700; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; margin-top:12px; }
  figure { margin:0; } figcaption { font-size:12px; color:#555; margin-bottom:3px; }
  canvas { border:1px solid #bbb; }
</style>
<script type="importmap">
{"imports":{"pdf-lib":"https://esm.sh/pdf-lib@1.17.1","@pdf-lib/fontkit":"https://esm.sh/@pdf-lib/fontkit@1.1.1"}}
</script>
<pre id="log">執行中…</pre>
<div class="row" id="out"></div>
<script type="module">
import * as pdfjs from 'https://esm.sh/pdfjs-dist@4.6.82/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://esm.sh/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';

import * as db from '../src/state/db.js';
import { exportPdf } from '../src/pdf/export.js';
import { detectFigures } from '../src/pdf/figures.js';
import { renderPage } from '../src/render/canvas.js';

const out = [];
let fails = 0;
const log = s => out.push(s);
const ok = (c, label, extra='') => { if (!c) fails++; log(`${c?'  ✓':'  ✗ 失敗'} ${label}${extra?'  → '+extra:''}`); };
const show = (el, cap) => {
  const f = document.createElement('figure');
  const c = document.createElement('figcaption'); c.textContent = cap;
  f.append(c, el); document.getElementById('out').append(f);
};

try {

/* ---------- 造一頁假書：直排內文 + 標題 + 插圖 + 頁碼 ---------- */

const W = 900, H = 1260;
const src = document.createElement('canvas');
src.width = W; src.height = H;
const g = src.getContext('2d');
g.fillStyle = '#f7f2e8'; g.fillRect(0, 0, W, H);
// 一張插圖：漸層方塊，邊緣密度高，應該會被偵測到
const grad = g.createLinearGradient(120, 180, 420, 480);
grad.addColorStop(0, '#3a6ea5'); grad.addColorStop(1, '#c0d6e4');
g.fillStyle = grad; g.fillRect(120, 180, 300, 300);
g.strokeStyle = '#123'; g.lineWidth = 3; g.strokeRect(120, 180, 300, 300);
for (let i = 0; i < 12; i++) {
  g.beginPath(); g.moveTo(120, 180 + i * 25); g.lineTo(420, 480 - i * 20); g.stroke();
}
g.fillStyle = '#555'; g.font = '22px serif'; g.fillText('- 一二 -', W / 2 - 40, H - 50);

const blob = await new Promise(r => src.toBlob(r, 'image/jpeg', 0.92));

const project = await db.createProject('__匯出測試__');
const page = {
  id: db.uid('pg_'), projectId: project.id, index: 0, status: 'translated',
  source: 'camera', origBlob: blob, origW: W, origH: H,
  procBlob: blob, procW: W, procH: H,
  corners: [[0,0],[W,0],[W,H],[0,H]], vertical: true, nativeText: null,
};
await db.put('pages', page);

const mk = o => ({ id: db.uid('bk_'), pageId: page.id, projectId: project.id,
  vertical: true, skipTranslate: false, lines: [], poly: null, ...o });

const blocks = [
  mk({ order: 0, kind: 'title', bbox: [700, 100, 90, 260], fontSize: 46,
       srcText: '第一章　猫', dstText: '第一章　貓' }),
  mk({ order: 1, kind: 'body', bbox: [470, 100, 200, 1000], fontSize: 30,
       srcText: '吾輩は猫である。',
       dstText: '我是貓。名字嘛，還沒有。\n究竟生在何處，全然沒有頭緒——只記得在昏暗潮濕的地方喵喵地哭著。' }),
  mk({ order: 2, kind: 'caption', bbox: [120, 500, 300, 60], fontSize: 20, vertical: false,
       srcText: '図1', dstText: '圖一　書房的窗' }),
  mk({ order: 3, kind: 'pagenum', bbox: [400, 1190, 110, 40], fontSize: 22, vertical: false,
       srcText: '一二', dstText: '', skipTranslate: true }),
];
await db.putMany('blocks', blocks);

/* ================= 1. 圖片區偵測 ================= */

log('【1】圖片區偵測');
{
  const bmp = await createImageBitmap(blob);
  const figs = detectFigures(bmp, blocks);
  ok(figs.length >= 1, '偵測到至少一個候選區', String(figs.length));

  const hit = figs.find(f =>
    f.x < 220 && f.y < 280 && f.x + f.w > 320 && f.y + f.h > 380);
  ok(Boolean(hit), '候選區涵蓋插圖的位置',
     hit ? `x=${hit.x|0} y=${hit.y|0} w=${hit.w|0} h=${hit.h|0}` : JSON.stringify(figs.slice(0,3)));

  // 文字區不該被當成圖
  const overText = figs.filter(f => f.x > 450 && f.x < 800 && f.h > 500);
  ok(overText.length === 0, '直排內文沒有被誤判成圖片', String(overText.length));

  if (hit) {
    await db.put('figures', { id: db.uid('fg_'), pageId: page.id, projectId: project.id, ...hit });
  }

  const preview = document.createElement('canvas');
  preview.width = W / 2; preview.height = H / 2;
  const pc = preview.getContext('2d');
  pc.drawImage(bmp, 0, 0, preview.width, preview.height);
  pc.strokeStyle = '#e00'; pc.lineWidth = 2;
  for (const f of figs) pc.strokeRect(f.x/2, f.y/2, f.w/2, f.h/2);
  show(preview, `原頁與偵測到的圖片候選（${figs.length} 個）`);
  bmp.close?.();
}

/* ================= 2. 預覽渲染 ================= */

log('\n【2】canvas 預覽');
{
  const { canvas, report } = renderPage({ width: W, height: H }, blocks, { scale: 0.5 });
  ok(report.length === 3, '三個有譯文的區塊被排版（頁碼不算）', String(report.length));
  ok(report.every(r => !r.overflow), '沒有溢出',
     JSON.stringify(report.map(r => r.scale.toFixed(2))));
  show(canvas, '排版預覽（canvas）');
}

/* ================= 3. 匯出 PDF ================= */

log('\n【3】匯出 PDF');
const t0 = performance.now();
const { blob: pdfBlob, warnings } = await exportPdf(project, [page], {});
const ms = performance.now() - t0;

ok(pdfBlob.size > 0, 'PDF 有產出', `${(pdfBlob.size/1024).toFixed(0)}KB / ${Math.round(ms)}ms`);
log('  提醒：' + (warnings.length ? warnings.map(w => w.message).join('；') : '（無）'));

/* ================= 4. 讀回來驗證 ================= */

log('\n【4】用 pdf.js 讀回來');
{
  const bytes = new Uint8Array(await pdfBlob.arrayBuffer());
  const doc = await pdfjs.getDocument({ data: bytes }).promise;
  ok(doc.numPages === 1, '一頁', String(doc.numPages));

  const p1 = await doc.getPage(1);
  const vp = p1.getViewport({ scale: 1 });
  ok(Math.abs(vp.height - 842) < 1, '長邊為 842pt（A4 高）', vp.height.toFixed(1));
  ok(Math.abs(vp.width / vp.height - W / H) < 0.01, '長寬比與原頁一致',
     `${(vp.width/vp.height).toFixed(3)} vs ${(W/H).toFixed(3)}`);

  const tc = await p1.getTextContent();
  const text = tc.items.map(i => i.str).join('');
  ok(text.includes('第一章'), '文字層含標題', text.slice(0, 30));
  ok(text.includes('我是貓'), '文字層含內文');
  ok(!text.includes('一二'), '頁碼沒有進文字層（是裁圖貼回的）');

  const rc = document.createElement('canvas');
  const rvp = p1.getViewport({ scale: 1.1 });
  rc.width = rvp.width; rc.height = rvp.height;
  const rctx = rc.getContext('2d');
  rctx.fillStyle = '#fff'; rctx.fillRect(0, 0, rc.width, rc.height);
  await p1.render({ canvasContext: rctx, viewport: rvp }).promise;
  show(rc, `匯出的 PDF（pdf.js 渲染回來）${(pdfBlob.size/1024).toFixed(0)}KB`);
}

await db.deleteProject(project.id);
await db.del('pages', page.id);

log('\n' + (fails === 0 ? '✅ 全部通過（測試資料已清除）' : `❌ 有 ${fails} 項失敗`));

} catch (e) {
  log('\n❌ ' + e.stack);
  fails++;
}

const el = document.getElementById('log');
el.textContent = out.join('\n');
el.className = fails === 0 ? 'pass' : 'fail';
document.title = fails === 0 ? 'PASS' : 'FAIL ' + fails;
</script>
