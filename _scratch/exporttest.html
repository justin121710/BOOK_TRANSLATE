<!DOCTYPE html>
<meta charset="utf-8">
<title>PDF 匯出驗證</title>
<style>
  body { background:#fff; color:#111; font:13px/1.6 system-ui; margin:12px; }
  pre { background:#f5f5f5; padding:10px; white-space:pre-wrap; font-size:12px; }
  .pass { color:#0a0; } .fail { color:#c00; font-weight:700; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; margin-top:12px; }
  figure { margin:0; } figcaption { font-size:12px; color:#555; margin-bottom:3px; }
  canvas { border:1px solid #bbb; }
</style>
<script type="importmap">
{"imports":{"pdf-lib":"https://esm.sh/pdf-lib@1.17.1","@pdf-lib/fontkit":"https://esm.sh/@pdf-lib/fontkit@1.1.1"}}
</script>
<pre id="log">執行中…</pre>
<div class="row" id="out"></div>
<script type="module">
import * as pdfjs from 'https://esm.sh/pdfjs-dist@4.6.82/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://esm.sh/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';

import * as db from '../src/state/db.js';
import { exportPdf } from '../src/pdf/export.js';
import { detectFigures } from '../src/pdf/figures.js';
import { renderPage } from '../src/render/canvas.js';

const out = [];
let fails = 0;
const log = s => out.push(s);
const ok = (c, label, extra='') => { if (!c) fails++; log(`${c?'  ✓':'  ✗ 失敗'} ${label}${extra?'  → '+extra:''}`); };
const show = (el, cap) => {
  const f = document.createElement('figure');
  const c = document.createElement('figcaption'); c.textContent = cap;
  f.append(c, el); document.getElementById('out').append(f);
};

try {

/* ---------- 造一頁假書：直排內文 + 標題 + 插圖 + 頁碼 ---------- */

const W = 900, H = 1260;
const src = document.createElement('canvas');
src.width = W; src.height = H;
const g = src.getContext('2d');
g.fillStyle = '#f7f2e8'; g.fillRect(0, 0, W, H);
// 一張插圖：漸層方塊，邊緣密度高，應該會被偵測到
const grad = g.createLinearGradient(120, 180, 420, 480);
grad.addColorStop(0, '#3a6ea5'); grad.addColorStop(1, '#c0d6e4');
g.fillStyle = grad; g.fillRect(120, 180, 300, 300);
g.strokeStyle = '#123'; g.lineWidth = 3; g.strokeRect(120, 180, 300, 300);
for (let i = 0; i < 12; i++) {
  g.beginPath(); g.moveTo(120, 180 + i * 25); g.lineTo(420, 480 - i * 20); g.stroke();
}
g.fillStyle = '#555'; g.font = '22px serif'; g.fillText('- 一二 -', W / 2 - 40, H - 50);

const blob = await new Promise(r => src.toBlob(r, 'image/jpeg', 0.92));

const project = await db.createProject('__匯出測試__');
const page = {
  id: db.uid('pg_'), projectId: project.id, index: 0, status: 'translated',
  source: 'camera', origBlob: blob, origW: W, origH: H,
  procBlob: blob, procW: W, procH: H,
  corners: [[0,0],[W,0],[W,H],[0,H]], vertical: true, nativeText: null,
};
await db.put('pages', page);

const mk = o => ({ id: db.uid('bk_'), pageId: page.id, projectId: project.id,
  vertical: true, skipTranslate: false, lines: [], poly: null, ...o });

const blocks = [
  mk({ order: 0, kind: 'title', bbox: [700, 100, 90, 260], fontSize: 46,
       srcText: '第一章　猫', dstText: '第一章　貓' }),
  mk({ order: 1, kind: 'body', bbox: [470, 100, 200, 1000], fontSize: 30,
       srcText: '吾輩は猫である。',
       dstText: '我是貓。名字嘛，還沒有。\n究竟生在何處，全然沒有頭緒——只記得在昏暗潮濕的地方喵喵地哭著。' }),
  mk({ order: 2, kind: 'caption', bbox: [120, 500, 300, 60], fontSize: 20, vertical: false,
       srcText: '図1', dstText: '圖一　書房的窗' }),
  mk({ order: 3, kind: 'pagenum', bbox: [400, 1190, 110, 40], fontSize: 22, vertical: false,
       srcText: '一二', dstText: '', skipTranslate: true }),
];
await db.putMany('blocks', blocks);

/* ================= 1. 圖片區偵測 ================= */

log('【1】圖片區偵測');
{
  const bmp = await createImageBitmap(blob);
  const figs = detectFigures(bmp, blocks);
  ok(figs.length >= 1, '偵測到至少一個候選區', String(figs.length));

  const hit = figs.find(f =>
    f.x < 220 && f.y < 280 && f.x + f.w > 320 && f.y + f.h > 380);
  ok(Boolean(hit), '候選區涵蓋插圖的位置',
     hit ? `x=${hit.x|0} y=${hit.y|0} w=${hit.w|0} h=${hit.h|0}` : JSON.stringify(figs.slice(0,3)));

  // 文字區不該被當成圖
  const overText = figs.filter(f => f.x > 450 && f.x < 800 && f.h > 500);
  ok(overText.length === 0, '直排內文沒有被誤判成圖片', String(overText.length));

  if (hit) {
    await db.put('figures', { id: db.uid('fg_'), pageId: page.id, projectId: project.id, ...hit });
  }

  const preview = document.createElement('canvas');
  preview.width = W / 2; preview.height = H / 2;
  const pc = preview.getContext('2d');
  pc.drawImage(bmp, 0, 0, preview.width, preview.height);
  pc.strokeStyle = '#e00'; pc.lineWidth = 2;
  for (const f of figs) pc.strokeRect(f.x/2, f.y/2, f.w/2, f.h/2);
  show(preview, `原頁與偵測到的圖片候選（${figs.length} 個）`);
  bmp.close?.();
}

/* ================= 2. 預覽渲染 ================= */

log('\n【2】canvas 預覽');
{
  const { canvas, report } = renderPage({ width: W, height: H }, blocks, { scale: 0.5 });
  ok(report.length === 3, '三個有譯文的區塊被排版（頁碼不算）', String(report.length));
  ok(report.every(r => !r.overflow), '沒有溢出',
     JSON.stringify(report.map(r => r.scale.toFixed(2))));
  show(canvas, '排版預覽（canvas）');
}

/* ================= 3. 匯出 PDF ================= */

log('\n【3】匯出 PDF');
const t0 = performance.now();
const { blob: pdfBlob, warnings } = await exportPdf(project, [page], {});
const ms = performance.now() - t0;

ok(pdfBlob.size > 0, 'PDF 有產出', `${(pdfBlob.size/1024).toFixed(0)}KB / ${Math.round(ms)}ms`);
log('  提醒：' + (warnings.length ? warnings.map(w => w.message).join('；') : '（無）'));

/* ================= 3b. 圖內文字覆蓋 ================= */

log('\n【3b】圖內文字：蓋掉原字再寫中譯');
{
  const W2 = 600, H2 = 400;
  const c2 = document.createElement('canvas');
  c2.width = W2; c2.height = H2;
  const g2 = c2.getContext('2d');
  g2.fillStyle = '#ffffff'; g2.fillRect(0, 0, W2, H2);
  // 一張有明顯底色的插圖，塗白會很難看
  g2.fillStyle = '#2e6f8e'; g2.fillRect(40, 40, 520, 320);
  // 圖上的日文招牌
  g2.fillStyle = '#ffffff'; g2.font = 'bold 42px serif';
  g2.fillText('入口', 240, 220);

  const blob2 = await new Promise(r => c2.toBlob(r, 'image/png'));
  const proj2 = await db.createProject('__圖內文字測試__');
  const pg2 = {
    id: db.uid('pg_'), projectId: proj2.id, index: 0, status: 'translated',
    source: 'camera', origBlob: blob2, origW: W2, origH: H2,
    procBlob: blob2, procW: W2, procH: H2,
    corners: [[0,0],[W2,0],[W2,H2],[0,H2]], vertical: false, nativeText: null,
  };
  await db.put('pages', pg2);

  const fig = { id: db.uid('fg_'), pageId: pg2.id, projectId: proj2.id,
                x: 40, y: 40, w: 520, h: 320 };
  await db.put('figures', fig);

  /* 刻意把 kind 留成 body：模擬「辨識完才回頭補畫圖片框」的實際情況。
     這正是先前的 bug —— 只信資料庫裡的舊分類，插圖會連原本的日文一起貼回去，
     中譯再疊上來，兩層字重在一起。 */
  const ft = { id: db.uid('bk_'), pageId: pg2.id, projectId: proj2.id, order: 0,
    kind: 'body', vertical: false,
    bbox: [236, 180, 92, 52], fontSize: 42,
    srcText: '入口', dstText: '入口處', skipTranslate: false, lines: [], poly: null };
  await db.putMany('blocks', [ft]);

  const { figureOf } = await import('../src/pdf/figures.js');
  ok(Boolean(figureOf(ft, [fig])), '即使 kind 還是 body，仍判定為落在圖片框內');
  ok(!figureOf({ bbox: [10, 10, 20, 20] }, [fig]), '框外的文字塊不會被誤判');

  // 取樣到的背景色應該接近插圖底色，而不是白色
  const { sampleBackground, inkFor } = await import('../src/pdf/figures.js');
  const bmp2 = await createImageBitmap(blob2);
  const bg = sampleBackground(bmp2, { x: 236, y: 180, w: 92, h: 52 });
  ok(bg.b > bg.r + 20, '取樣到插圖的藍色底而不是白色',
     `rgb(${bg.r},${bg.g},${bg.b})`);
  const ink = inkFor(bg);
  ok(ink.r > 0.5, '深底色配淺色文字', JSON.stringify(ink));

  const { blob: pdf2 } = await exportPdf(proj2, [pg2], {});
  const doc2 = await pdfjs.getDocument({ data: new Uint8Array(await pdf2.arrayBuffer()) }).promise;
  const page2 = await doc2.getPage(1);
  const t2 = (await page2.getTextContent()).items.map(i => i.str).join('');
  ok(t2.includes('入口處'), '中譯有寫進 PDF', t2);

  const vp2 = page2.getViewport({ scale: 1.2 });
  const rc2 = document.createElement('canvas');
  rc2.width = vp2.width; rc2.height = vp2.height;
  const rx = rc2.getContext('2d', { willReadFrequently: true });
  rx.fillStyle = '#fff'; rx.fillRect(0, 0, rc2.width, rc2.height);
  await page2.render({ canvasContext: rx, viewport: vp2 }).promise;
  show(rc2, '圖內文字取代後的 PDF');

  // 覆蓋處不該出現白斑：取文字框附近的像素檢查它仍是藍底
  const px = rx.getImageData(Math.round(rc2.width * 0.32), Math.round(rc2.height * 0.5), 1, 1).data;
  ok(px[2] > px[0] + 15, '覆蓋區域仍是插圖底色，沒有白斑',
     `rgb(${px[0]},${px[1]},${px[2]})`);

  /* 原字真的被蓋掉了嗎？
     日文「入口」印在 rgb(46,111,142) 的底上是白字。若沒被蓋掉，
     覆蓋區內會同時存在原字與中譯的白色像素，數量會明顯偏多。
     這裡比對「有覆蓋」與「不覆蓋直接畫原圖」兩者的白色像素數。 */
  {
    const x0 = Math.round(rc2.width * (236 - 20) / W2);
    const y0 = Math.round(rc2.height * (180 - 20) / H2);
    const w0 = Math.round(rc2.width * (92 + 40) / W2);
    const h0 = Math.round(rc2.height * (52 + 40) / H2);
    const region = rx.getImageData(x0, y0, w0, h0).data;
    let whiteAfter = 0;
    for (let i = 0; i < region.length; i += 4) {
      if (region[i] > 200 && region[i + 1] > 200 && region[i + 2] > 200) whiteAfter++;
    }

    // 同一區域在原圖上的白色像素數（只有日文「入口」）
    const ref = document.createElement('canvas');
    ref.width = w0; ref.height = h0;
    const rfx = ref.getContext('2d', { willReadFrequently: true });
    rfx.drawImage(bmp2, 236 - 20, 180 - 20, 92 + 40, 52 + 40, 0, 0, w0, h0);
    const refData = rfx.getImageData(0, 0, w0, h0).data;
    let whiteBefore = 0;
    for (let i = 0; i < refData.length; i += 4) {
      if (refData[i] > 200 && refData[i + 1] > 200 && refData[i + 2] > 200) whiteBefore++;
    }

    // 中譯「入口處」比原文「入口」多一個字，但若原字沒被蓋掉會是兩者相加
    ok(whiteAfter < whiteBefore * 1.9,
       '原本的日文確實被蓋掉了，不是疊在中譯下面',
       `原圖白點 ${whiteBefore} → 匯出後 ${whiteAfter}`);
  }

  await db.deleteProject(proj2.id);
  await db.del('pages', pg2.id);
  bmp2.close?.();
}

/* ================= 3c. 行內公式與方程式框 ================= */

log('\n【3c】行內公式內嵌小圖、方程式框原樣貼回');
{
  const W3 = 700, H3 = 500;
  const c3 = document.createElement('canvas');
  c3.width = W3; c3.height = H3;
  const g3 = c3.getContext('2d');
  g3.fillStyle = '#fff'; g3.fillRect(0, 0, W3, H3);
  // 行內公式：在一段文字中間畫一個明顯的紅色符號當標記
  g3.fillStyle = '#c00'; g3.font = 'bold 26px serif';
  g3.fillText('Fmax', 300, 120);
  // 獨立方程式：一整行綠色
  g3.fillStyle = '#0a6'; g3.font = 'bold 30px serif';
  g3.fillText('E = mc²', 250, 300);

  const blob3 = await new Promise(r => c3.toBlob(r, 'image/png'));
  const proj3 = await db.createProject('__公式測試__');
  const pg3 = {
    id: db.uid('pg_'), projectId: proj3.id, index: 0, status: 'translated',
    source: 'camera', origBlob: blob3, origW: W3, origH: H3,
    procBlob: blob3, procW: W3, procH: H3,
    corners: [[0,0],[W3,0],[W3,H3],[0,H3]], vertical: false, nativeText: null,
  };
  await db.put('pages', pg3);

  // 方程式框
  const eqBox = { id: db.uid('fg_'), pageId: pg3.id, projectId: proj3.id,
                  x: 240, y: 265, w: 220, h: 50, kind: 'equation' };
  await db.put('figures', eqBox);

  const blocks3 = [
    // 含行內公式佔位符的正文
    { id: db.uid('bk_'), pageId: pg3.id, projectId: proj3.id, order: 0,
      kind: 'body', vertical: false, bbox: [60, 95, 560, 40], fontSize: 26,
      srcText: 'この⟦M1⟧は大きい', dstText: '這個 ⟦M1⟧ 很大',
      mathSpans: [{ id: 1, src: 'Fmax', bbox: [298, 96, 78, 30] }],
      skipTranslate: false, lines: [], poly: null },
    // 方程式框內的文字：不翻譯
    { id: db.uid('bk_'), pageId: pg3.id, projectId: proj3.id, order: 1,
      kind: 'equation', vertical: false, bbox: [248, 272, 200, 36], fontSize: 30,
      srcText: 'E=mc2', dstText: '', skipTranslate: true, lines: [], poly: null },
  ];
  await db.putMany('blocks', blocks3);

  const { blob: pdf3 } = await exportPdf(proj3, [pg3], {});
  const doc3 = await pdfjs.getDocument({ data: new Uint8Array(await pdf3.arrayBuffer()) }).promise;
  const p3 = await doc3.getPage(1);

  const t3 = (await p3.getTextContent()).items.map(i => i.str).join('');
  ok(t3.includes('這個') && t3.includes('很大'), '正文有翻譯', t3);
  ok(!t3.includes('⟦M1⟧'), '佔位符沒有被當成文字印出來', t3);
  ok(!t3.includes('E=mc2'), '方程式框內的文字沒有被重畫成文字');

  const vp3 = p3.getViewport({ scale: 1.2 });
  const rc3 = document.createElement('canvas');
  rc3.width = vp3.width; rc3.height = vp3.height;
  const rx3 = rc3.getContext('2d', { willReadFrequently: true });
  rx3.fillStyle = '#fff'; rx3.fillRect(0, 0, rc3.width, rc3.height);
  await p3.render({ canvasContext: rx3, viewport: vp3 }).promise;
  show(rc3, '行內公式（紅）與方程式框（綠）');

  // 兩者都應該以圖片的形式出現在頁面上，所以顏色要還在
  const all = rx3.getImageData(0, 0, rc3.width, rc3.height).data;
  let red = 0, green = 0;
  for (let i = 0; i < all.length; i += 4) {
    if (all[i] > 130 && all[i+1] < 90 && all[i+2] < 90) red++;
    if (all[i+1] > 110 && all[i] < 110 && all[i+2] < 140) green++;
  }
  ok(red > 40, '行內公式以原圖的樣子出現（紅色像素還在）', String(red));
  ok(green > 40, '方程式整塊原樣貼回（綠色像素還在）', String(green));

  await db.deleteProject(proj3.id);
  await db.del('pages', pg3.id);
}

/* ================= 4. 讀回來驗證 ================= */

log('\n【4】用 pdf.js 讀回來');
{
  const bytes = new Uint8Array(await pdfBlob.arrayBuffer());
  const doc = await pdfjs.getDocument({ data: bytes }).promise;
  ok(doc.numPages === 1, '一頁', String(doc.numPages));

  const p1 = await doc.getPage(1);
  const vp = p1.getViewport({ scale: 1 });
  ok(Math.abs(vp.height - 842) < 1, '長邊為 842pt（A4 高）', vp.height.toFixed(1));
  ok(Math.abs(vp.width / vp.height - W / H) < 0.01, '長寬比與原頁一致',
     `${(vp.width/vp.height).toFixed(3)} vs ${(W/H).toFixed(3)}`);

  const tc = await p1.getTextContent();
  const text = tc.items.map(i => i.str).join('');
  ok(text.includes('第一章'), '文字層含標題', text.slice(0, 30));
  ok(text.includes('我是貓'), '文字層含內文');
  ok(!text.includes('一二'), '頁碼沒有進文字層（是裁圖貼回的）');
  // 破折號畫成矩形，但要疊一層透明文字，否則複製貼上會掉字
  ok(text.includes('——'), '破折號仍在文字層（畫成長條之外另疊透明文字）',
     JSON.stringify(text.slice(text.indexOf('頭緒'), text.indexOf('頭緒') + 6)));

  const rc = document.createElement('canvas');
  const rvp = p1.getViewport({ scale: 1.1 });
  rc.width = rvp.width; rc.height = rvp.height;
  const rctx = rc.getContext('2d');
  rctx.fillStyle = '#fff'; rctx.fillRect(0, 0, rc.width, rc.height);
  await p1.render({ canvasContext: rctx, viewport: rvp }).promise;
  show(rc, `匯出的 PDF（pdf.js 渲染回來）${(pdfBlob.size/1024).toFixed(0)}KB`);
}

await db.deleteProject(project.id);
await db.del('pages', page.id);

log('\n' + (fails === 0 ? '✅ 全部通過（測試資料已清除）' : `❌ 有 ${fails} 項失敗`));

} catch (e) {
  log('\n❌ ' + e.stack);
  fails++;
}

const el = document.getElementById('log');
el.textContent = out.join('\n');
el.className = fails === 0 ? 'pass' : 'fail';
document.title = fails === 0 ? 'PASS' : 'FAIL ' + fails;
</script>
