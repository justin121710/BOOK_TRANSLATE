<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>書籍翻譯器</title>
<meta name="description" content="書籍翻譯、PDF 重製與文字辨識">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="書籍翻譯">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<script type="importmap">
{
  "imports": {
    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
    "@pdf-lib/fontkit": "https://esm.sh/@pdf-lib/fontkit@1.1.1",
    "pdfjs-dist/": "https://esm.sh/pdfjs-dist@4.6.82/",
    "jszip": "https://esm.sh/jszip@3.10.1"
  }
}
</script>
</head>
<body>

<div id="app">

  <header id="topbar">
    <!-- 圖標由 src/ui/icons.js 注入，避免同一個符號在 HTML 與 JS 各寫一份 -->
    <button id="navBack" class="icon-btn" hidden aria-label="返回"></button>
    <h1 id="topTitle">書籍翻譯器</h1>
    <button id="navSettings" class="icon-btn" aria-label="設定"></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="toasts" aria-live="assertive"></div>

</div>

<template id="tpl-tools">
  <nav class="tool-tabs" aria-label="PDF 工具">
    <a class="tool-tab" href="#home" data-tool="translate">翻譯並重製 PDF</a>
    <a class="tool-tab" href="#searchable" data-tool="searchable">加上文字層</a>
  </nav>
</template>

<template id="tpl-home">
  <section class="view pad tool-view">
    <div class="tool-hero">
      <h2>翻譯並重製 PDF</h2>
    </div>
    <div id="keyWarn" class="banner banner-warn" hidden>
      尚未設定 API 金鑰。
      <button class="link" data-go="settings">前往設定</button>
    </div>
    <form id="translateStart" class="tool-form">
      <div class="tool-picker">
        <label for="translateFile">選擇 PDF</label>
        <input id="translateFile" type="file" accept=".pdf,application/pdf">
      </div>
      <label class="tool-select" for="translateLanguage">翻譯成
        <select id="translateLanguage"></select>
      </label>
      <button id="translateOpen" class="btn btn-primary tool-primary" type="submit" disabled>匯入並開始</button>
    </form>

    <div class="row-between tool-library">
      <h2>我的書</h2>
      <button id="newProject" class="btn">新增書籍</button>
    </div>
    <ul id="projectList" class="card-list"></ul>
    <p id="storageNote" class="hint storage-note">
      資料存在這支裝置的瀏覽器裡。請用主畫面的圖示開啟，
      以網頁形式長期不用可能會被系統清除。重要的書請定期備份。
    </p>
  </section>
</template>

<template id="tpl-searchable">
  <section class="view pad tool-view">
    <div class="tool-hero">
      <h2>加上文字層</h2>
    </div>
    <form class="tool-form">
      <div class="tool-picker">
        <label for="searchableFile">選擇 PDF</label>
        <input id="searchableFile" type="file" accept=".pdf,application/pdf" required>
      </div>
      <details class="tool-options">
        <summary>辨識設定</summary>
        <label for="searchableWatermarks">排除浮水印文字</label>
        <textarea id="searchableWatermarks" rows="2" spellcheck="false" autocomplete="off"
          placeholder="每行填一組字樣"></textarea>
      </details>
      <button id="searchableStart" type="submit" class="btn btn-primary tool-primary">開始辨識</button>
      <button id="searchableCancel" type="button" class="btn" hidden>停止</button>
    </form>
    <p id="searchablePending"></p>
    <p id="searchableStatus" role="status"></p>
    <button id="searchableResume" type="button" class="btn btn-primary" hidden>繼續處理</button>
    <button id="searchableDiscard" type="button" class="btn" hidden>捨棄未完成的工作</button>
    <p id="searchableSummary" class="hint"></p>
    <details id="searchablePreview" hidden>
      <summary id="searchablePreviewTitle">預覽浮水印過濾</summary>
      <img id="searchablePreviewImage" class="searchable-preview-image" alt="過濾前的原始頁面">
      <p><strong>排除的字樣</strong> <span id="searchablePreviewRemoved"></span></p>
      <p><strong>保留的文字（節錄）</strong></p>
      <p id="searchablePreviewText"></p>
    </details>
    <div id="searchableDownload" hidden></div>
    <button id="searchableMergeOutput" type="button" class="btn btn-primary" hidden>合併整本</button>
    <button id="searchableDeleteOutput" type="button" class="btn" hidden>移除儲存的成品</button>
  </section>
</template>

<template id="tpl-settings">
  <section class="view pad">
    <h2>設定</h2>

    <div class="banner banner-info" id="privacyNote"></div>

    <div class="field">
      <label for="kGoogle">Google Cloud Vision API 金鑰</label>
      <div class="input-wrap">
        <input id="kGoogle" type="password" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="AIza…">
        <button class="reveal" data-reveal="kGoogle" aria-label="顯示金鑰"></button>
      </div>
      <p class="hint">
        用於 OCR 與版面座標偵測。請到 Google Cloud Console 為這把金鑰加上
        <strong>HTTP referrer 限制</strong>，只允許本站網域，否則金鑰外流會被盜用。
      </p>
      <p class="hint" id="gStat"></p>
    </div>

    <div class="field">
      <label for="provider">翻譯供應商</label>
      <select id="provider">
        <option value="gemini">Google Gemini — 可與上面同一把金鑰共用</option>
        <option value="claude">Anthropic Claude — 需要另一把金鑰</option>
      </select>
      <p class="hint" id="providerHint"></p>
    </div>

    <div class="field" id="geminiFields">
      <label for="kGemini">Gemini API 金鑰<span class="label-note">（可留空）</span></label>
      <div class="input-wrap">
        <input id="kGemini" type="password" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="留空則沿用上面的 Google 金鑰">
        <button class="reveal" data-reveal="kGemini" aria-label="顯示金鑰"></button>
      </div>
      <p class="hint">
        <strong>通常需要另外一把。</strong>Generative Language API 不支援 HTTP referrer
        限制，所以無法和設了網站限制的 Vision 金鑰共用——Cloud Console 會擋下這個組合。
        最快的取得方式是 Google AI Studio，該金鑰的應用程式限制只能選「無」，
        請改用配額與花費上限保護。留空則沿用上面那把（僅在該金鑰未設網站限制時可行）。
      </p>

      <label for="mGemini" style="margin-top:14px">Gemini 模型</label>
      <div class="row-gap" style="margin-top:6px">
        <select id="mGemini" style="flex:1"></select>
        <button id="refreshModels" class="btn">重新取得清單</button>
      </div>
      <p class="hint" id="gemStat"></p>
    </div>

    <div class="field" id="claudeFields">
      <label for="kClaude">Anthropic (Claude) API 金鑰</label>
      <div class="input-wrap">
        <input id="kClaude" type="password" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="sk-ant-…">
        <button class="reveal" data-reveal="kClaude" aria-label="顯示金鑰"></button>
      </div>
      <p class="hint">
        這把金鑰沒有來源限制機制，外流後在任何地方都能用，建議單獨建一把並設花費上限。
      </p>
      <p class="hint" id="cStat"></p>

      <label for="mClaude" style="margin-top:14px">Claude 模型</label>
      <select id="mClaude">
        <option value="claude-opus-5">Opus 5 — 品質最好，成本最高</option>
        <option value="claude-sonnet-5">Sonnet 5 — 品質好，成本低很多</option>
      </select>
    </div>

    <div class="row-gap">
      <button id="testKeys" class="btn">測試金鑰</button>
      <button id="saveKeys" class="btn btn-primary">儲存</button>
    </div>

    <hr>

    <h3>字型</h3>
    <p class="hint">
      匯出 PDF 需要嵌入繁體中文字型，否則別人的電腦打不開。
      內文使用思源宋體、標題使用思源黑體，首次下載後會快取在這支手機上。
    </p>
    <ul id="fontList" class="card-list compact"></ul>
    <button id="fetchFonts" class="btn">下載並快取字型</button>

    <hr>

    <h3>儲存空間</h3>
    <p class="hint" id="quota">計算中…</p>
    <button id="wipe" class="btn btn-danger">清除所有本機資料</button>

    <p class="hint" id="version" style="margin-top:20px"></p>
  </section>
</template>

<script type="module" src="./src/main.js"></script>
</body>
</html>
